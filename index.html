<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISSA YANAGIYA Contents Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <script>
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const size = 3 + Math.random() * 7;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*98}%;top:${Math.random()*98}%;animation-duration:${1.8+Math.random()*4}s;animation-delay:${Math.random()*7}s;`;
      document.body.appendChild(s);
    }
  </script>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="site-title-wrap">
      <h1 class="site-title">ISSA YANAGIYA</h1>
    </div>
    <div class="site-subtitle">Contents Gallery</div>
    <div class="hero-divider"></div>
  </header>

  <main class="container">

    <!-- カテゴリタブ -->
    <div class="category-tabs">
      <button class="ctab active" data-category="all">ALL</button>
      <button class="ctab" data-category="oshi_camera">推しカメラ</button>
      <button class="ctab" data-category="performance">パフォーマンス</button>
      <button class="ctab" data-category="behind">ビハインド</button>
      <button class="ctab" data-category="group">グループ</button>
      <button class="ctab" data-category="individual">個人</button>
    </div>

    <!-- 投稿エリア -->
    <div id="postsContainer"></div>

  </main>

  <footer class="site-footer">
    <button class="admin-toggle" onclick="toggleAdminPrompt()" title="管理者">🔑</button>
  </footer>

  <!-- 管理者ロック画面 -->
  <div id="adminPrompt" class="admin-prompt hidden">
    <div class="admin-prompt-box">
      <p class="admin-prompt-label">合言葉を入力</p>
      <input type="password" id="adminSecretInput" placeholder="合言葉" autocomplete="off">
      <div class="admin-prompt-btns">
        <button onclick="submitAdminSecret()">ログイン</button>
        <button onclick="closeAdminPrompt()">キャンセル</button>
      </div>
      <p id="adminPromptMsg" class="admin-prompt-msg"></p>
    </div>
  </div>

  <!-- 管理者パネル -->
  <div id="adminPanel" class="admin-panel hidden">
    <div class="admin-panel-inner">
      <div class="admin-panel-header">
        <span>🔑 管理者モード</span>
        <button onclick="closeAdminPanel()">✕ 閉じる</button>
      </div>
      <form id="adminForm" class="admin-form">
        <div class="admin-form-row">
          <label>URL</label>
          <input type="url" id="adminUrl" placeholder="https://..." required>
        </div>
        <div class="admin-form-row-split">
          <div class="admin-form-row">
            <label>プラットフォーム</label>
            <select id="adminPlatform">
              <option value="youtube">YouTube</option>
              <option value="x">X</option>
              <option value="instagram">Instagram</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div class="admin-form-row">
            <label>カテゴリ</label>
            <select id="adminCategory">
              <option value="oshi_camera">推しカメラ</option>
              <option value="performance">パフォーマンス</option>
              <option value="behind">ビハインド</option>
              <option value="group">グループ</option>
              <option value="individual">個人</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">投稿する</button>
        <p id="adminMsg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
