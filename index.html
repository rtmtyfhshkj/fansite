<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柳谷伊冴 ファンサイト ✨</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-deco deco-star">★</div>
      <div class="header-deco deco-heart">♥</div>
      <div class="header-deco deco-note">♪</div>
      <h1 class="site-title">柳谷伊冴<span class="title-sub">ファンサイト</span></h1>
      <p class="site-desc">推しの魅力をみんなでシェアしよう！</p>
    </div>
  </header>

  <main class="container">

    <!-- 投稿フォーム -->
    <section class="post-section card">
      <h2 class="section-title">
        <span class="icon">📌</span> リンクを投稿する
      </h2>
      <form id="postForm">
        <div class="form-row">
          <label>YouTube / Instagram URL <span class="required">必須</span></label>
          <input type="url" id="postUrl" placeholder="https://www.youtube.com/..." required>
        </div>
        <div class="form-row">
          <label>タイトル <span class="required">必須</span></label>
          <input type="text" id="postTitle" placeholder="この動画のここが最高！" required>
        </div>
        <div class="form-row">
          <label>一言コメント</label>
          <textarea id="postDesc" placeholder="おすすめポイントを教えて！" rows="3"></textarea>
        </div>
        <div class="form-row-split">
          <div class="form-row">
            <label>名前 <span class="required">必須</span></label>
            <input type="text" id="postAuthor" placeholder="ファン名" required>
          </div>
          <div class="form-row">
            <label>合言葉 <span class="required">必須</span></label>
            <input type="password" id="postSecret" placeholder="合言葉を入力" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">投稿する ✨</button>
        <p class="form-msg" id="postMsg"></p>
      </form>
    </section>

    <!-- 投稿一覧 -->
    <section class="board-section">
      <h2 class="section-title">
        <span class="icon">🎬</span> みんなの投稿
      </h2>
      <div id="postsContainer" class="posts-grid">
        <div class="loading">読み込み中...</div>
      </div>
    </section>
  </main>

  <!-- コメントモーダル -->
  <div id="commentModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3 id="modalTitle" class="modal-title"></h3>
      <div id="commentsList" class="comments-list"></div>
      <form id="commentForm" class="comment-form">
        <textarea id="commentContent" placeholder="コメントを書く..." rows="3" required></textarea>
        <div class="comment-form-row">
          <input type="text" id="commentAuthor" placeholder="名前" required>
          <input type="password" id="commentSecret" placeholder="合言葉" required>
          <button type="submit" class="btn btn-accent">送信</button>
        </div>
        <p class="form-msg" id="commentMsg"></p>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>💛 柳谷伊冴くんへの愛をここに 💛</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
