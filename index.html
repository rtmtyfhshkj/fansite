<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISSA YANAGIYA Contents Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <script>
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const size = 1 + Math.random() * 2.5;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*5}s;animation-delay:${Math.random()*8}s;`;
      document.body.appendChild(s);
    }
    function createShootingStar() {
      const s = document.createElement('div');
      s.className = 'shooting-star';
      s.style.left = (5 + Math.random() * 55) + '%';
      s.style.top  = (3 + Math.random() * 45) + '%';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1300);
    }
    setInterval(() => { if (Math.random() < 0.55) createShootingStar(); }, 3500);
  </script>

  <div class="betelgeuse" onclick="toggleAdminPrompt()"></div>

  <header class="site-header">
    <div class="site-title-wrap">
      <h1 class="site-title">ISSA YANAGIYA</h1>
    </div>
    <div class="site-subtitle">Contents Gallery</div>
    <div class="hero-divider"></div>
  </header>

  <main class="container">
    <div class="category-tabs">
      <button class="ctab active" data-category="all">ALL</button>
      <button class="ctab" data-category="focus_cam">Focus Cam</button>
      <button class="ctab" data-category="performance">Performance</button>
      <button class="ctab" data-category="group">Group</button>
      <button class="ctab" data-category="solo">Solo</button>
      <button class="ctab" data-category="behind">Behind</button>
      <button class="ctab" data-category="photo">Photo</button>
      <button class="ctab" data-category="others">Others</button>
    </div>
    <div id="postsContainer"></div>
  </main>

  <footer class="site-footer">
    <button class="admin-toggle" onclick="toggleAdminPrompt()" title="Admin">🔑</button>
  </footer>

  <!-- Admin Login -->
  <div id="adminPrompt" class="admin-prompt hidden">
    <div class="admin-prompt-box">
      <p class="admin-prompt-label">Password</p>
      <input type="password" id="adminSecretInput" placeholder="Password" autocomplete="off">
      <div class="admin-prompt-btns">
        <button onclick="submitAdminSecret()">Login</button>
        <button onclick="closeAdminPrompt()">Cancel</button>
      </div>
      <p id="adminPromptMsg" class="admin-prompt-msg"></p>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="admin-panel hidden">
    <div class="admin-panel-inner">
      <div class="admin-panel-header">
        <span>🔑 Admin</span>
        <button onclick="closeAdminPanel()">✕ Close</button>
      </div>
      <form id="adminForm" class="admin-form">
        <div class="admin-form-row">
          <label>URL</label>
          <input type="url" id="adminUrl" placeholder="https://..." required>
        </div>
        <div class="admin-form-row">
          <label>Title</label>
          <input type="text" id="adminTitle" placeholder="Video title..." required>
        </div>
        <div class="admin-form-row-split">
          <div class="admin-form-row">
            <label>Platform</label>
            <select id="adminPlatform">
              <option value="youtube">YouTube</option>
              <option value="x">X</option>
              <option value="instagram">Instagram</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div class="admin-form-row">
            <label>Category</label>
            <select id="adminCategory">
              <option value="focus_cam">Focus Cam</option>
              <option value="performance">Performance</option>
              <option value="group">Group</option>
              <option value="solo">Solo</option>
              <option value="behind">Behind</option>
              <option value="photo">Photo</option>
              <option value="others">Others</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Post</button>
        <p id="adminMsg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
