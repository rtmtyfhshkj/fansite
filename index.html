<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柳谷伊冴 ファンサイト</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <script>
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 70;
      b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*18}s;animation-delay:${Math.random()*14}s;`;
      document.body.appendChild(b);
    }
  </script>

  <!-- ヘッダー -->
  <header class="site-header">
    <p class="hero-sub">ISSA Fan Community</p>
    <h1 class="site-title">柳谷伊冴<span class="title-sub">ファンサイト</span></h1>
    <p class="site-desc">推しの魅力をぎゅっとまとめました</p>
    <div class="hero-divider"></div>
  </header>

  <main class="container">

    <!-- プラットフォームタブ -->
    <div class="platform-tabs">
      <button class="ptab active" data-platform="youtube">▶ YouTube</button>
      <button class="ptab" data-platform="x">𝕏 X</button>
      <button class="ptab" data-platform="instagram">📷 Instagram</button>
      <button class="ptab" data-platform="tiktok">🎵 TikTok</button>
    </div>

    <!-- カテゴリタブ -->
    <div class="category-tabs">
      <button class="ctab active" data-category="all">すべて</button>
      <button class="ctab" data-category="performance">パフォーマンス</button>
      <button class="ctab" data-category="oshi_camera">推しカメラ</button>
      <button class="ctab" data-category="behind">ビハインド</button>
      <button class="ctab" data-category="group">グループ</button>
      <button class="ctab" data-category="individual">個人</button>
    </div>

    <!-- 投稿一覧 -->
    <div id="postsContainer" class="posts-grid">
      <div class="loading">読み込み中...</div>
    </div>

  </main>

  <footer class="site-footer">
    <p>🩵 柳谷伊冴くんへの愛をここに 🩵</p>
    <button class="admin-toggle" onclick="toggleAdminPrompt()" title="管理者">🔑</button>
  </footer>

  <!-- 管理者ロック画面 -->
  <div id="adminPrompt" class="admin-prompt hidden">
    <div class="admin-prompt-box">
      <p class="admin-prompt-label">合言葉を入力</p>
      <input type="password" id="adminSecretInput" placeholder="合言葉" autocomplete="off">
      <div class="admin-prompt-btns">
        <button onclick="submitAdminSecret()">ログイン</button>
        <button onclick="closeAdminPrompt()">キャンセル</button>
      </div>
      <p id="adminPromptMsg" class="admin-prompt-msg"></p>
    </div>
  </div>

  <!-- 管理者パネル（ロック解除後に表示） -->
  <div id="adminPanel" class="admin-panel hidden">
    <div class="admin-panel-inner">
      <div class="admin-panel-header">
        <span>🔑 管理者モード</span>
        <button onclick="closeAdminPanel()">✕ 閉じる</button>
      </div>
      <form id="adminForm" class="admin-form">
        <div class="admin-form-row">
          <label>URL</label>
          <input type="url" id="adminUrl" placeholder="https://..." required>
        </div>
        <div class="admin-form-row-split">
          <div class="admin-form-row">
            <label>プラットフォーム</label>
            <select id="adminPlatform">
              <option value="youtube">YouTube</option>
              <option value="x">X</option>
              <option value="instagram">Instagram</option>
              <option value="tiktok">TikTok</option>
            </select>
          </div>
          <div class="admin-form-row">
            <label>カテゴリ</label>
            <select id="adminCategory">
              <option value="performance">パフォーマンス</option>
              <option value="oshi_camera">推しカメラ</option>
              <option value="behind">ビハインド</option>
              <option value="group">グループ</option>
              <option value="individual">個人</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">投稿する</button>
        <p id="adminMsg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
